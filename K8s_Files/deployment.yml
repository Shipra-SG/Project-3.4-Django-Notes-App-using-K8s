apiVersion: apps/v1
kind: Deployment
metadata:
  name: note-app-deployment
  labels:
    app: note-app
  namespace: notes-app-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: note-app
  template:
    metadata:
      labels:
        app: note-app
    spec:
      containers:
        - name: notes-app-cont
          image: shiprag321/notes-app:v2
          ports:
            - containerPort: 8000
